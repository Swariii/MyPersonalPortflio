<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6A0DAD"/>
      <stop offset="100%" stop-color="#2D0054"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c9a8"/>
      <stop offset="100%" stop-color="#e0a880"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep background -->
  <rect width="500" height="600" fill="#0a0014"/>

  <!-- Aurora mesh blobs -->
  <circle cx="120" cy="120" r="180" fill="#A855F7" opacity="0.25" filter="blur(4px)"/>
  <circle cx="420" cy="180" r="160" fill="#C084FC" opacity="0.2" filter="blur(4px)"/>
  <circle cx="250" cy="520" r="200" fill="#6A0DAD" opacity="0.3" filter="blur(4px)"/>

  <!-- Grid lines -->
  <g stroke="#C084FC" stroke-width="0.8" opacity="0.25">
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
  </g>

  <!-- glow -->
  <ellipse cx="250" cy="250" rx="240" ry="260" fill="url(#glow2)"/>

  <!-- Neon orbit rings -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#A855F7" stroke-width="1.5" opacity="0.5" stroke-dasharray="10 6">
    <animateTransform attributeName="transform" type="rotate" from="0 250 250" to="360 250 250" dur="40s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="250" r="180" fill="none" stroke="#C084FC" stroke-width="1" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="360 250 250" to="0 250 250" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- Shoulders -->
  <path d="M120 600 C120 460 175 420 250 420 C325 420 380 460 380 600 Z" fill="#1a0b2e"/>

  <!-- Neck -->
  <rect x="222" y="330" width="56" height="55" rx="18" fill="url(#skin2)"/>

  <!-- Head -->
  <ellipse cx="250" cy="280" rx="90" ry="102" fill="url(#skin2)"/>

  <!-- Hair -->
  <path d="M160 270 C160 160 200 130 250 130 C300 130 340 160 340 270 L340 230 C340 190 300 160 250 160 C200 160 160 190 160 230 Z" fill="#2D0A4A"/>
  <path d="M160 270 C156 220 170 170 200 140 C168 160 150 210 154 265 Z" fill="#2D0A4A"/>

  <!-- Eyes -->
  <circle cx="222" cy="280" r="11" fill="#ffffff"/>
  <circle cx="278" cy="280" r="11" fill="#ffffff"/>
  <circle cx="225" cy="281" r="5.5" fill="#6A0DAD"/>
  <circle cx="281" cy="281" r="5.5" fill="#6A0DAD"/>
  <circle cx="227" cy="279" r="2" fill="#ffffff"/>
  <circle cx="283" cy="279" r="2" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M204 264 Q222 254 240 262" stroke="#2D0A4A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M260 262 Q278 254 296 264" stroke="#2D0A4A" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M250 288 L245 312 Q250 317 256 312" stroke="#d8a07a" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M227 330 Q250 350 273 330" stroke="#a86a5a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Glasses -->
  <rect x="200" y="266" width="44" height="32" rx="12" fill="none" stroke="#C084FC" stroke-width="3.5"/>
  <rect x="256" y="266" width="44" height="32" rx="12" fill="none" stroke="#C084FC" stroke-width="3.5"/>
  <line x1="244" y1="280" x2="256" y2="280" stroke="#C084FC" stroke-width="3.5"/>
  <line x1="200" y1="274" x2="185" y2="266" stroke="#C084FC" stroke-width="3.5"/>
  <line x1="300" y1="274" x2="315" y2="266" stroke="#C084FC" stroke-width="3.5"/>

  <!-- Floating code / tech around -->
  <g font-family="Arial" font-weight="bold">
    <text x="80" y="120" font-size="30" fill="#C084FC" opacity="0.9">{ }</text>
    <text x="400" y="100" font-size="26" fill="#A855F7" opacity="0.9">⚛</text>
    <text x="70" y="480" font-size="28" fill="#A855F7" opacity="0.9"></></text>
    <text x="400" y="480" font-size="26" fill="#C084FC" opacity="0.9">⚡</text>
  </g>

  <!-- Fading stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="60" r="2.5" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="50" r="2.5" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="380" r="2" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="300" r="2" opacity="0.7"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
